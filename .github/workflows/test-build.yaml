name: build-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  OPENAPI_GENERATOR_VERSION: 7.26.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - name: Get OpenAPI Generator
        run: wget -q https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/${OPENAPI_GENERATOR_VERSION}/openapi-generator-cli-${OPENAPI_GENERATOR_VERSION}.jar -O openapi-generator-cli.jar
      - name: Build twitter-openapi
        run: uv run python tools/build.py
      - name: Generate
        run: |
          java -jar openapi-generator-cli.jar generate -c test/python/openapi-generator-config.yaml -g python
          java -jar openapi-generator-cli.jar generate -c test/dart-dio/openapi-generator-config.yaml -g dart-dio
          java -jar openapi-generator-cli.jar generate -c test/typescript-fetch/openapi-generator-config.yaml -g typescript-fetch
