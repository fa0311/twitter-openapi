name: update-placeholder

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: fa0311/twitter-secrets@main
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Record requests from x.com
        run: uv run tools/update_placeholder.py --browser --relay https://raw.githubusercontent.com/fa0311/twitter_api_safe_relay/main/packages/server/requests.ndjson
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update-placeholder
          title: Update placeholder.json
          commit-message: Update placeholder.json
          body: queryId / method / features / fieldToggles recorded from a logged-in x.com session (`tools/update_placeholder.py --browser`). Only recorded operations are touched; the job log lists the operations that were not recorded, the recorded operations missing from placeholder.json and the `variables` drift.
