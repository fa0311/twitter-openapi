openapi: 3.0.3
info:
  title: Twitter OpenAPI
  version: 0.0.1

paths: {}
components:
  schemas:
    TimelineResult:
      properties:
        id:
          type: string
        timeline:
          $ref: "#/components/schemas/Timeline"

    Timeline:
      required:
        - "instructions"
      properties:
        instructions:
          type: array
          items:
            $ref: "./../schemas/instruction.yaml#/components/schemas/InstructionUnion"
        metadata:
          $ref: "#/components/schemas/TimelineMetadata"
        responseObjects:
          $ref: "#/components/schemas/TimelineResponseObjects"

    TimelineMetadata:
      required:
        - "scribeConfig"
      properties:
        reader_mode_config:
          $ref: "#/components/schemas/ReaderModeConfig"
        scribeConfig:
          $ref: "#/components/schemas/ScribeConfig"

    ReaderModeConfig:
      required:
        - "is_reader_mode_available"
      properties:
        is_reader_mode_available:
          type: boolean

    ScribeConfig:
      required:
        - "page"
      properties:
        page:
          type: string

    TimelineResponseObjects:
      properties:
        feedbackActions:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackActionEntry"

    FeedbackActionEntry:
      required:
        - "key"
        - "value"
      properties:
        key:
          type: string
        value:
          $ref: "#/components/schemas/FeedbackAction"

    FeedbackAction:
      required:
        - "confirmation"
        - "feedbackType"
        - "hasUndoAction"
        - "prompt"
      properties:
        childKeys:
          type: array
          items:
            type: string
        clientEventInfo:
          $ref: "./content.yaml#/components/schemas/FeedbackClientEventInfo"
        confirmation:
          type: string
        confirmationDisplayType:
          type: string # BottomSheet, Inline, ... (UI value, X keeps adding)
        feedbackType:
          type: string # DontLike, GiveFeedback, NotCredible, NotRelevant, SeeFewer, Dismiss, ... (X keeps adding)
        feedbackUrl:
          type: string
        hasUndoAction:
          type: boolean
        icon:
          type: string # Frown, ... (UI value, X keeps adding)
        prompt:
          type: string
