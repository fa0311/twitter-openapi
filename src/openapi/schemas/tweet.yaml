openapi: 3.0.3
info:
  title: Twitter OpenAPI
  version: 0.0.1

paths: {}

components:
  schemas:
    TweetUnion:
      oneOf:
        - $ref: "#/components/schemas/Tweet"
        - $ref: "#/components/schemas/TweetWithVisibilityResults"
        - $ref: "#/components/schemas/TweetTombstone"
        - $ref: "#/components/schemas/TweetUnavailable"
        - $ref: "#/components/schemas/TweetPreviewDisplay"
      discriminator:
        propertyName: __typename
        mapping": # deprecated
          Tweet: "#/components/schemas/Tweet"
          TweetWithVisibilityResults: "#/components/schemas/TweetWithVisibilityResults"
          TweetTombstone: "#/components/schemas/TweetTombstone"
          TweetUnavailable: "#/components/schemas/TweetUnavailable"
          TweetPreviewDisplay: "#/components/schemas/TweetPreviewDisplay"

    TweetWithVisibilityResults:
      required:
        - "__typename"
        - "tweet"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # TweetWithVisibilityResults
        tweet:
          $ref: "#/components/schemas/Tweet"
        limitedActionResults:
          $ref: "#/components/schemas/LimitedActionResults"
        tweetInterstitial:
          $ref: "#/components/schemas/TweetInterstitial"
        mediaVisibilityResults:
          $ref: "#/components/schemas/MediaVisibilityResults"

    TweetInterstitial:
      required:
        - "__typename"
        - "displayType"
        - "text"
        - "revealText"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # ContextualTweetInterstitial
        displayType:
          type: string
          enum: [NonCompliant, EntireTweet]
        text:
          $ref: "#/components/schemas/TweetInterstitialText"
        revealText:
          $ref: "#/components/schemas/TweetInterstitialRevealText"

    TweetInterstitialText:
      required:
        - "rtl"
        - "text"
        - "entities"
      properties:
        rtl:
          type: boolean
        text:
          type: string
        entities:
          type: array
          items:
            $ref: "#/components/schemas/TweetInterstitialTextEntity"

    TweetInterstitialTextEntity:
      required:
        - "fromIndex"
        - "toIndex"
        - "ref"
      properties:
        fromIndex:
          type: integer
        toIndex:
          type: integer
        ref:
          $ref: "#/components/schemas/TweetInterstitialTextEntityRef"

    TweetInterstitialTextEntityRef:
      required:
        - "type"
        - "url"
        - "urlType"
      properties:
        type:
          type: string
          enum: [TimelineUrl]
        url:
          type: string
          format: uri
        urlType:
          type: string
          enum: [ExternalUrl]

    MediaVisibilityResults:
      required:
        - "blurred_image_interstitial"
      properties:
        blurred_image_interstitial:
          $ref: "#/components/schemas/MediaVisibilityResultsBlurredImageInterstitial"

    MediaVisibilityResultsBlurredImageInterstitial:
      required:
        - "opacity"
        - "text"
        - "title"
      properties:
        opacity:
          type: number
        text:
          $ref: "#/components/schemas/TweetInterstitialText"
        title:
          $ref: "#/components/schemas/TweetInterstitialText"

    TweetInterstitialRevealText:
      required:
        - "rtl"
        - "text"
        - "entities"
      properties:
        rtl:
          type: boolean
        text:
          type: string
        entities:
          type: array
          items:
            $ref: "#/components/schemas/TweetInterstitialTextEntity"

    TweetTombstone: #remove tweet
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # TweetWithVisibilityResults
      additionalProperties: true # todo

    TweetUnavailable: # nsfw tweet
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # TweetUnavailable
        reason:
          type: string

    Tweet:
      required:
        - "rest_id"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # null | Tweet
        rest_id:
          type: string
          pattern: "^[0-9]+$"
        birdwatch_pivot:
          $ref: "#/components/schemas/BirdwatchPivot"
        core:
          $ref: "./user.yaml#/components/schemas/UserResultCore"
        card:
          $ref: "#/components/schemas/TweetCard"
        unmention_data:
          type: object
          properties: {} # always {}
        voiceInfo:
          type: object
          properties: {} # always {} (TweetDetail, 2026-10-17)
        edit_control:
          $ref: "#/components/schemas/TweetEditControl"
        edit_prespective:
          $ref: "#/components/schemas/TweetEditPrespective"
        is_translatable:
          type: boolean
        source:
          type: string # html (<a href="http://twitter.com/download/android" rel="nofollow">Twitter for Android</a>)
        jetfuel_attachment:
          $ref: "#/components/schemas/JetfuelAttachment"
        legacy:
          $ref: "#/components/schemas/TweetLegacy"
        views:
          $ref: "#/components/schemas/TweetView"
        quoted_status_result:
          $ref: "./content.yaml#/components/schemas/ItemResult"
        nested_quoted_tweet_results:
          $ref: "./content.yaml#/components/schemas/ItemResult"
        cashtag_attachments:
          type: array
          items:
            $ref: "#/components/schemas/CashtagAttachment"
        note_tweet:
          $ref: "#/components/schemas/NoteTweet"
        quick_promote_eligibility:
          type: object
        unified_card:
          $ref: "#/components/schemas/UnifiedCard"
        previous_counts:
          $ref: "#/components/schemas/TweetPreviousCounts"
        quotedRefResult:
          $ref: "#/components/schemas/QuotedRefResult"
        superFollowsReplyUserResult:
          $ref: "#/components/schemas/SuperFollowsReplyUserResult"
        has_birdwatch_notes:
          type: boolean
        community_relationship:
          $ref: "#/components/schemas/CommunityRelationship"
        author_community_relationship:
          $ref: "#/components/schemas/AuthorCommunityRelationship"
        article:
          $ref: "#/components/schemas/Article"
        community_results:
          $ref: "#/components/schemas/CommunityResult"
        trend_results:
          $ref: "#/components/schemas/TrendResults"
        grok_analysis_followups:
          type: array
          items:
            type: string
        grok_share_attachment:
          $ref: "#/components/schemas/GrokShareAttachment"
        grok_analysis_button:
          type: boolean
        post_image_description:
          type: string
        post_video_description:
          type: string
        grok_translated_post_with_availability:
          $ref: "#/components/schemas/GrokTranslatedPostWithAvailability"
        grok_annotations:
          $ref: "#/components/schemas/GrokAnnotation"
        content_disclosure:
          $ref: "#/components/schemas/ContentDisclosure"
        postCta:
          $ref: "#/components/schemas/TweetPostCta"

    JetfuelAttachment: # responsive_web_jetfuel_frame; an opaque frame payload (seen on an NFL live chat card)
      required:
        - "height"
        - "payload"
      properties:
        height:
          type: integer
        payload:
          type: string

    CashtagAttachment:
      required:
        - "rest_id"
      properties:
        rest_id:
          type: string
        size_variant:
          type: integer

    TweetLegacyPlace: # geo-tagged post (27 recorded)
      required:
        - "bounding_box"
        - "country"
        - "country_code"
        - "full_name"
        - "id"
        - "name"
        - "place_type"
        - "url"
      properties:
        bounding_box:
          $ref: "#/components/schemas/TweetLegacyPlaceBoundingBox"
        country:
          type: string
        country_code:
          type: string
        full_name:
          type: string
        id:
          type: string
        name:
          type: string
        place_type:
          type: string # city, country, ...
        url:
          type: string
          format: uri

    TweetLegacyPlaceBoundingBox: # GeoJSON
      required:
        - "coordinates"
        - "type"
      properties:
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
        type:
          type: string
          enum: [Polygon]

    TweetLegacyPoint: # GeoJSON
      required:
        - "coordinates"
        - "type"
      properties:
        coordinates:
          type: array
          items:
            type: number
        type:
          type: string
          enum: [Point]

    TweetEditControl:
      properties:
        edit_tweet_ids:
          type: array
          items:
            type: string
            pattern: "^[0-9]+$"
        editable_until_msecs:
          type: string
          pattern: "^[0-9]+$"
        is_edit_eligible:
          type: boolean
        edits_remaining:
          type: string
          pattern: "^[0-9]+$"
        initial_tweet_id:
          type: string
          pattern: "^[0-9]+$"
        edit_control_initial:
          $ref: "#/components/schemas/TweetEditControlInitial"

    TweetEditControlInitial:
      required:
        - "edit_tweet_ids"
        - "editable_until_msecs"
        - "is_edit_eligible"
        - "edits_remaining"
      properties:
        edit_tweet_ids:
          type: array
          items:
            type: string
            pattern: "^[0-9]+$"
        editable_until_msecs:
          type: string
          pattern: "^[0-9]+$"
        is_edit_eligible:
          type: boolean
        edits_remaining:
          type: string
          pattern: "^[0-9]+$"

    TweetEditPrespective:
      properties:
        favorited:
          type: boolean
        retweeted:
          type: boolean
    TweetView:
      required:
        - "state"
      properties:
        count:
          type: string
          pattern: "^[0-9]+$"
        state:
          type: string
          enum:
            - Enabled
            - EnabledWithCount

    NoteTweet:
      required:
        - "note_tweet_results"
      properties:
        is_expandable:
          type: boolean
        note_tweet_results:
          $ref: "#/components/schemas/NoteTweetResult"

    NoteTweetResult:
      required:
        - "result"
      properties:
        result:
          $ref: "#/components/schemas/NoteTweetResultData"

    NoteTweetResultData: # sometimes only {id} (UserTweets, 2026-10-17)
      required:
        - "id"
      properties:
        entity_set:
          $ref: "#/components/schemas/Entities"
        id:
          type: string
          pattern: "^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{2}==)?$" # base64
        media:
          $ref: "#/components/schemas/NoteTweetResultMedia"
        richtext:
          $ref: "#/components/schemas/NoteTweetResultRichText"
        text:
          type: string

    NoteTweetResultMedia:
      required:
        - "inline_media"
      properties:
        inline_media:
          type: array
          items:
            $ref: "#/components/schemas/NoteTweetResultMediaInlineMedia"

    NoteTweetResultMediaInlineMedia:
      required:
        - "media_id"
        - "index"
      properties:
        media_id:
          type: string
          pattern: "^[0-9]+$"
        index:
          type: integer

    NoteTweetResultRichText:
      required:
        - "richtext_tags"
      properties:
        richtext_tags:
          type: array
          items:
            $ref: "#/components/schemas/NoteTweetResultRichTextTag"

    NoteTweetResultRichTextTag:
      required:
        - "from_index"
        - "to_index"
        - "richtext_types"
      properties:
        from_index:
          type: integer
        to_index:
          type: integer
        richtext_types:
          type: array
          items:
            type: string
            enum: [Bold, Italic]

    UnifiedCard:
      required:
        - "card_fetch_state"
      properties:
        card_fetch_state:
          type: string
          enum: [NoCard]

    TweetPreviousCounts:
      required:
        - "bookmark_count"
        - "favorite_count"
        - "quote_count"
        - "reply_count"
        - "retweet_count"
      properties:
        bookmark_count:
          type: integer
        favorite_count:
          type: integer
        quote_count:
          type: integer
        reply_count:
          type: integer
        retweet_count:
          type: integer

    QuotedRefResult:
      properties:
        result:
          $ref: "#/components/schemas/TweetUnion"

    SuperFollowsReplyUserResult:
      required:
        - "result"
      properties:
        result:
          $ref: "#/components/schemas/SuperFollowsReplyUserResultData"

    SuperFollowsReplyUserResultData:
      required:
        - "__typename"
      properties:
        __typename:
          $ref: "./../schemas/typename.yaml#/components/schemas/TypeName" # User
        # legacy:
        #   $ref: "#/components/schemas/SuperFollowsReplyUserResultLegacy"
        core:
          $ref: "#/components/schemas/SuperFollowsReplyUserResultCore"

    SuperFollowsReplyUserResultLegacy:
      required:
        - "screen_name"
      properties:
        screen_name:
          type: string

    SuperFollowsReplyUserResultCore:
      required:
        - "screen_name"
      properties:
        screen_name:
          type: string

    CommunityRelationship:
      required:
        - "id"
        - "rest_id"
        - "moderation_state"
        - "actions"
      properties:
        id:
          type: string
        rest_id:
          type: string
          pattern: "^[0-9]+$"
        moderation_state:
          $ref: "#/components/schemas/CommunityModerationState"
        actions:
          $ref: "#/components/schemas/CommunityActions"

    CommunityModerationState:
      required:
        - "__typename"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # CommunityUserDefaultModerationState

    AuthorCommunityRelationship:
      required:
        - "community_results"
      properties:
        community_results:
          $ref: "#/components/schemas/CommunityResult"
        role:
          type: string
          enum: [Member, Moderator, Admin, NonMember]
        user_results:
          $ref: "user.yaml#/components/schemas/UserResults"

    CommunityResult:
      required:
        - "result"
      properties:
        result:
          $ref: "#/components/schemas/CommunityUnion"

    CommunityUnion:
      oneOf:
        - $ref: "#/components/schemas/Community"
        - $ref: "#/components/schemas/CommunityUnavailable"

      discriminator:
        propertyName: __typename
        mapping": # deprecated
          Community: "#/components/schemas/Community"
          CommunityUnavailable: "#/components/schemas/CommunityUnavailable"

    CommunityUnavailable:
      required:
        - "__typename"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # CommunityUnavailable

    Community:
      required:
        - "__typename"
        # - "id_str"
        # - "name"
        # - "description"
        # - "search_tags"
        # - "actions"
        # - "admin_results"
        # - "creator_results"
        # - "invites_result"
        # - "join_policy"
        # - "invites_policy"
        # - "is_pinned"
        # - "members_facepile_results"
        # - "moderator_count"
        # - "member_count"
        # - "role"
        # - "rules"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # Community
        id_str:
          type: string
          pattern: "^[0-9]+$"
        name:
          type: string
        description:
          type: string
        created_at:
          type: integer
        question:
          type: string
        search_tags:
          type: array
          items:
            type: string
        primary_community_topic:
          $ref: "#/components/schemas/PrimaryCommunityTopic"
        actions:
          $ref: "#/components/schemas/CommunityActions"
        admin_results:
          $ref: "user.yaml#/components/schemas/UserResults"
        creator_results:
          $ref: "user.yaml#/components/schemas/UserResults"
        invites_result:
          $ref: "#/components/schemas/CommunityInvitesResult"
        join_requests_result:
          $ref: "#/components/schemas/CommunityJoinRequestsResult"
        join_policy:
          type: string
          enum: [Open, RestrictedJoinRequestsRequireModeratorApproval]
        invites_policy:
          type: string
          enum: [MemberInvitesAllowed, ModeratorInvitesAllowed]
        is_nsfw:
          type: boolean # on CommunityDiscoveryTimeline and community search items
        is_pinned:
          type: boolean
        members_facepile_results:
          type: array
          items:
            $ref: "user.yaml#/components/schemas/UserResults"
        moderator_count:
          type: integer
        member_count:
          type: integer
        role:
          type: string
          enum: [NonMember]
        rules:
          type: array
          items:
            $ref: "#/components/schemas/CommunityRule"
        show_only_users_to_display:
          type: array
          items:
            type: string
        urls:
          $ref: "#/components/schemas/CommunityUrls"
        default_banner_media:
          $ref: "#/components/schemas/CommunityBannerMedia"
        custom_banner_media:
          $ref: "#/components/schemas/CommunityBannerMedia"
        viewer_relationship:
          $ref: "#/components/schemas/CommunityViewerRelationship"

    CommunityBannerMedia:
      required:
        - "media_info"
      properties:
        id:
          type: string
        media_info:
          $ref: "#/components/schemas/CommunityBannerMediaInfo"

    CommunityBannerMediaInfo:
      required:
        - "color_info"
        - "original_img_height"
        - "original_img_url"
        - "original_img_width"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # ApiImage
        color_info:
          $ref: "./media.yaml#/components/schemas/MediaColorInfo"
        original_img_height:
          type: integer
        original_img_url:
          type: string
          format: uri
        original_img_width:
          type: integer
        salient_rect:
          $ref: "./media.yaml#/components/schemas/MediaSalientRect"

    CommunityViewerRelationship:
      required:
        - "moderation_state"
      properties:
        id:
          type: string
        moderation_state:
          $ref: "#/components/schemas/CommunityModerationState"

    PrimaryCommunityTopic:
      required:
        - "topic_id"
        - "topic_name"
      properties:
        topic_id:
          type: string
          pattern: "^[0-9]+$"
        topic_name:
          type: string

    CommunityActions:
      # required:
      #   - "pin_action_result"
      properties:
        delete_action_result:
          $ref: "#/components/schemas/CommunityDeleteActionResult"
        join_action_result:
          $ref: "#/components/schemas/CommunityJoinActionResultUnion"
        leave_action_result:
          $ref: "#/components/schemas/CommunityLeaveActionResult"
        pin_action_result:
          $ref: "#/components/schemas/CommunityPinActionResult"
        unpin_action_result:
          $ref: "#/components/schemas/CommunityUnpinActionResult"

    CommunityDeleteActionResult:
      required:
        - "__typename"
        - "reason"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # CommunityDeleteActionUnavailable
        reason:
          type: string
          enum: [Unavailable]

    CommunityJoinActionResultUnion:
      oneOf:
        - $ref: "#/components/schemas/CommunityJoinAction"
        - $ref: "#/components/schemas/CommunityJoinActionUnavailable"
      discriminator:
        propertyName: __typename
        mapping: # deprecated
          CommunityJoinAction: "#/components/schemas/CommunityJoinAction"
          CommunityJoinActionUnavailable: "#/components/schemas/CommunityJoinActionUnavailable"

    CommunityJoinAction:
      required:
        - "__typename"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # CommunityJoinAction

    CommunityJoinActionUnavailable:
      required:
        - "__typename"
        - "reason"
        - "message"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # CommunityJoinActionUnavailable
        reason:
          type: string
          enum: [ViewerRequestRequired]
        message:
          type: string

    CommunityLeaveActionResult:
      required:
        - "__typename"
        - "reason"
        - "message"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # CommunityLeaveActionUnavailable
        reason:
          type: string
          enum: [ViewerNotMember]
        message:
          type: string

    CommunityPinActionResult:
      required:
        - "__typename"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # CommunityTweetPinActionUnavailable

    CommunityUnpinActionResult:
      required:
        - "__typename"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # CommunityTweetUnpinActionUnavailable

    CommunityInvitesResult:
      required:
        - "__typename"
        - "reason"
        - "message"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # CommunityInvitesUnavailable
        reason:
          type: string
          enum: [Unavailable]
        message:
          type: string

    CommunityJoinRequestsResult:
      required:
        - "__typename"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # CommunityJoinRequestsUnavailable

    CommunityRule:
      required:
        - "rest_id"
        - "name"
      properties:
        rest_id:
          type: string
          pattern: "^[0-9]+$"
        name:
          type: string
        description:
          type: string

    CommunityUrls:
      required:
        - "permalink"
      properties:
        permalink:
          $ref: "#/components/schemas/CommunityUrlsPermalink"

    CommunityUrlsPermalink:
      required:
        - "url"
      properties:
        url:
          type: string
          format: uri

    BirdwatchPivot:
      required:
        - "destinationUrl"
        - "title"
        - "iconType"
      properties:
        destinationUrl:
          type: string
          format: uri
        footer:
          $ref: "#/components/schemas/BirdwatchPivotFooter"
        note:
          $ref: "#/components/schemas/BirdwatchPivotNote"
        subtitle:
          $ref: "#/components/schemas/BirdwatchPivotSubtitle"
        title:
          type: string
        shorttitle:
          type: string
        visualStyle:
          type: string
          enum: [Default, Tentative]
        iconType:
          type: string
          # BirdwatchV1Icon, BirdwatchCameraVideo, BirdwatchPhoto, BirdwatchLink, ... (X keeps adding)
        callToAction:
          $ref: "#/components/schemas/BirdwatchPivotCallToAction"
        titleDetail:
          type: string
        footerIconType:
          type: string
          enum: [BirdwatchEyeOff, BirdwatchLevelLow]

    BirdwatchPivotFooter:
      required:
        - "text"
        - "entities"
      properties:
        text:
          type: string
        entities:
          type: array
          items:
            $ref: "#/components/schemas/BirdwatchEntity"

    BirdwatchEntity:
      required:
        - "fromIndex"
        - "toIndex"
        - "ref"
      properties:
        fromIndex:
          type: integer
        toIndex:
          type: integer
        ref:
          $ref: "#/components/schemas/BirdwatchEntityRef"

    BirdwatchEntityRef: # Union
      required:
        - "type"
      properties:
        type:
          type: string
          enum: [TimelineUrl, TimelineRichTextHashtag]
        url:
          type: string
          format: uri
        urlType:
          type: string
          enum: [ExternalUrl]
        expandedUrl:
          type: string
          format: uri
        text:
          type: string

    BirdwatchPivotNote:
      required:
        - "rest_id"
      properties:
        rest_id:
          type: string
          pattern: "^[0-9]+$"
        language:
          type: string
          # enum: [ja, en]
        is_community_note_translatable:
          type: boolean
        grok_translated_community_note_with_availability:
          $ref: "#/components/schemas/GrokTranslatedCommunityNoteWithAvailability"

    GrokTranslatedCommunityNoteWithAvailability:
      required:
        - "is_available"
      properties:
        is_available:
          type: boolean
        data:
          $ref: "#/components/schemas/GrokTranslatedCommunityNote"

    GrokTranslatedCommunityNote:
      required:
        - "source_language"
        - "destination_language"
        - "translation"
        - "translation_available"
      properties:
        source_language:
          type: string
          # enum: [ja, en]
        destination_language:
          type: string
          # enum: [ja, en]
        translation:
          type: string
        translation_available:
          type: boolean
        rich_text_entities:
          type: array
          items:
            $ref: "#/components/schemas/GrokEntity"

    GrokEntity:
      required:
        - "from_index"
        - "to_index"
        - "ref"
      properties:
        from_index:
          type: string # why string?
        to_index:
          type: string # why string?
        ref:
          $ref: "#/components/schemas/GrokEntityRef"

    GrokEntityRef:
      required:
