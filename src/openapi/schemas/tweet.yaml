    TrendResults:
      required:
        - "rest_id"
      properties:
        rest_id:
          type: string
          pattern: "^[0-9]+$"

    GrokShareAttachment:
      required:
        - "items"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GrokShareAttachmentItem"

    GrokShareAttachmentItem:
      required:
        - "media_urls"
        - "message"
      properties:
        media_urls:
          type: array
          items:
            type: string
            format: uri
        message:
          type: string
        analysis_post_id_results:
          $ref: "#/components/schemas/AnalysisResults"
        deepsearch_headers:
          type: array
          items:
            $ref: "#/components/schemas/DeepsearchHeader"

    DeepsearchHeader:
      required:
        - "steps"
      properties:
        steps:
          type: array
          items:
            $ref: "#/components/schemas/DeepsearchStep"

    DeepsearchStep:
      required:
        - "web_results"
        - "x_post_ids"
      properties:
        web_results:
          type: array
          items:
            $ref: "#/components/schemas/DeepsearchWebResult"
        x_post_ids:
          type: array
          items:
            type: string
            pattern: "^[0-9]+$"

    DeepsearchWebResult:
      required:
        - "url"
      properties:
        url:
          type: string
          format: uri

    AnalysisResults:
      required:
        - "result"
      properties:
        result:
          $ref: "#/components/schemas/Tweet"

    GrokTranslatedPostWithAvailability:
      required:
        - "is_available"
      properties:
        is_available:
          type: boolean
        data:
          $ref: "#/components/schemas/GrokTranslatedPost"

    GrokTranslatedPost:
      properties:
        translation:
          type: string
        source_language:
          type: string
        destination_language:
          type: string
        entities:
          $ref: "#/components/schemas/Entities"
        associated_data:
          type: object
          properties: {} # always {}
        preview_translation:
          type: string

    GrokAnnotation:
      properties:
        is_image_editable_by_grok:
          type: boolean

    # 'advertising_disclosure' ={'is_paid_promotion': True}
    ContentDisclosure:
      properties:
        ai_generated_disclosure:
          $ref: "#/components/schemas/ContentDisclosureAiGeneratedDisclosure"
        advertising_disclosure:
          $ref: "#/components/schemas/ContentDisclosureAdvertisingDisclosure"

    ContentDisclosureAiGeneratedDisclosure:
      required:
        - "can_edit"
        - "has_ai_generated_media"
      properties:
        ai_generated_detection_source:
          type: string
          enum:
            - C2paClient
            - ContentDisclosureAiGeneratedDisclosure
            - UserDeclared
            - GrokSignature
        can_edit:
          type: boolean
        has_ai_generated_media:
          type: boolean

    ContentDisclosureAdvertisingDisclosure:
      required:
        - "is_paid_promotion"
      properties:
        is_paid_promotion:
          type: boolean

    TweetPostCta:
      required:
        - "display_locations"
        - "post_cta"
      properties:
        display_locations:
          type: array
          items:
            type: string
            enum: [TweetDetails, ForYouTimeline, RepliesTimeline]
        post_cta:
          $ref: "#/components/schemas/PostCta"
        scribe_id:
          type: string # grok_web_cta

    PostCta:
      required:
        - "action_url"
        - "background_color"
        - "show_chevron"
        - "stroke_color"
        - "title_text"
      properties:
        action_url:
          type: string
          format: uri
        background_color:
          type: string
        show_chevron:
          type: boolean
        stroke_color:
          type: string
        title_text:
          $ref: "#/components/schemas/PostCtaTitleText"

    PostCtaTitleText:
      required:
        - "text"
        - "entities"
      properties:
        text:
          type: string
        entities:
          type: array
          items:
            $ref: "#/components/schemas/PostCtaTitleTextEntity"

    PostCtaTitleTextEntity:
      required:
        - "fromIndex"
        - "toIndex"
        - "ref"
      properties:
        fromIndex:
          type: integer
        toIndex:
          type: integer
        ref:
          $ref: "#/components/schemas/PostCtaTitleTextEntityRef"

    PostCtaTitleTextEntityRef:
      required:
        - "__typename"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # TimelineRichTextUser
        user_results:
          $ref: "user.yaml#/components/schemas/PostCtaUserResults"

    PostCtaUserResults:
      required:
        - "result"
      properties:
        result:
          $ref: "#/components/schemas/PostCtaUserResultsResult"

    PostCtaUserResultsResult:
      required:
        - "__typename"
        - "avatar"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # User
        avatar:
          $ref: "#/components/schemas/PostCtaUserResultsAvatar"

    PostCtaUserResultsAvatar:
      required:
        - "image_url"
      properties:
        image_url:
          type: string
          format: uri

    TweetPreviewDisplay:
      required:
        - "__typename"
        - "tweet"
        - "limited_action_results"
        - "cta"

      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # TweetPreviewDisplay
        tweet:
          $ref: "#/components/schemas/TweetPreviewDisplayTweet"
        limited_action_results:
          $ref: "#/components/schemas/TweetLimitedActionResults"
        cta:
          $ref: "#/components/schemas/TweetPreviewDisplayCta"

    TweetPreviewDisplayTweet:
      required:
        - "rest_id"
        - "text"
        - "core"
        - "entities"
        - "reply_count"
        - "retweet_count"
        - "favorite_count"
        - "bookmark_count"
        - "quote_count"
        - "view_count"
        - "created_at"
      properties:
        rest_id:
          type: string
          pattern: "^[0-9]+$"
        text:
          type: string
        core:
          $ref: "./user.yaml#/components/schemas/UserResultCore"
        entities:
          type: object # {}
          # $ref: "#/components/schemas/Entities"
        reply_count:
          type: integer
        retweet_count:
          type: integer
        favorite_count:
          type: integer
        bookmark_count:
          type: integer
        quote_count:
          type: integer
        view_count:
          $ref: "#/components/schemas/TweetPreviewDisplayTweetViewCount"
        created_at:
          $ref: "./general.yaml#/components/schemas/TwitterTimeFormat"
        article_preview:
          $ref: "#/components/schemas/ArticlePreview"

    TweetPreviewDisplayTweetViewCount:
      required:
        - "count"
      properties:
        count:
          type: string
          pattern: "^[0-9]+$"

    TweetLimitedActionResults:
      required:
        - "limited_actions"
      properties:
        limited_actions:
          type: array
          items:
            $ref: "#/components/schemas/LimitedActionResultsData"

    LimitedActionResultsData:
      required:
        - "action"
      properties:
        action:
          type: string # Reply, Retweet, QuoteTweet, Like, React, AddToBookmarks, AddToMoment, PinToProfile, ViewHiddenReplies, VoteOnPoll, ShowRetweetActionMenu, ReplyDownVote, SendViaDm, ViewPostEngagements, CopyLink, ... (X keeps adding UI actions)

    LimitedActionResults: # TweetWithVisibilityResults.limitedActionResults
      required:
        - "limited_actions"
      properties:
        limited_actions:
          type: array
          items:
            $ref: "#/components/schemas/LimitedAction"

    LimitedAction:
      required:
        - "action"
      properties:
        action:
          type: string # same values as LimitedActionResultsData.action, plus ShareTweetVia
        prompt:
          $ref: "#/components/schemas/CtaLimitedActionPrompt" # Reply only

    CtaLimitedActionPrompt:
      required:
        - "__typename"
        - "cta_type"
        - "headline"
        - "subtext"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # CtaLimitedActionPrompt
        cta_type:
          type: string
          enum: [SeeConversation]
        headline:
          $ref: "#/components/schemas/CtaLimitedActionPromptText"
        subtext:
          $ref: "#/components/schemas/CtaLimitedActionPromptText"

    CtaLimitedActionPromptText:
      required:
        - "entities"
        - "text"
      properties:
        entities:
          type: array
          items:
            type: object
            properties: {} # always []
        text:
          type: string

    TweetPreviewDisplayCta:
      required:
        - "title"
        - "url"
      properties:
        title:
          type: string
        url:
          $ref: "#/components/schemas/TweetPreviewDisplayCtaUrl"

    TweetPreviewDisplayCtaUrl:
      required:
        - "url"
        - "urlType"
      properties:
        url:
          type: string
          format: uri
        urlType:
          type: string
          enum: ["DeepLink", "UrtEndpoint", "ExternalUrl"]
