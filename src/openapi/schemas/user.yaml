openapi: 3.0.3
info:
  title: Twitter OpenAPI
  version: 0.0.1
paths: {}
components:
  schemas:
    UserResultCore:
      required:
        - "user_results"
      properties:
        user_results:
          $ref: "#/components/schemas/UserResults"

    UserResults:
      properties:
        result:
          $ref: "#/components/schemas/UserUnion"

    UserUnion:
      oneOf:
        - $ref: "#/components/schemas/User"
        - $ref: "#/components/schemas/UserUnavailable"
      discriminator:
        propertyName: __typename
        mapping": # deprecated
          User: "#/components/schemas/User"
          UserUnavailable: "#/components/schemas/UserUnavailable"

    User:
      required:
        - "__typename"
        - "id"
        - "is_blue_verified"
        - "rest_id"
        - "profile_image_shape"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # User
        affiliates_highlighted_label:
          $ref: "#/components/schemas/AffiliatesHighlightedLabel"
        has_graduated_access:
          type: boolean
        has_nft_avatar:
          type: boolean
        id:
          type: string
          pattern: "^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{2}==)?$" # base64
        is_blue_verified:
          type: boolean
        legacy:
          $ref: "#/components/schemas/UserLegacy"
        rest_id:
          type: string
          pattern: "^[0-9]+$"
        business_account:
          type: object
          properties: {} # always {}
        super_follow_eligible:
          type: boolean
        super_followed_by:
          type: boolean
        super_following:
          type: boolean
        profile_image_shape:
          type: string
          enum:
            - "Circle"
            - "Square"
            - "Hexagon"
        professional:
          $ref: "#/components/schemas/UserProfessional"
        user_seed_tweet_count:
          type: integer
        highlights_info:
          $ref: "#/components/schemas/UserHighlightsInfo"
        creator_subscriptions_count:
          type: integer
        verification_info:
          $ref: "#/components/schemas/UserVerificationInfo"
        is_profile_translatable:
          type: boolean
        tipjar_settings:
          $ref: "#/components/schemas/UserTipJarSettings"
        legacy_extended_profile:
          $ref: "#/components/schemas/UserLegacyExtendedProfile"
        has_hidden_likes_on_profile:
          type: boolean
        premium_gifting_eligible:
          type: boolean
        has_hidden_subscriptions_on_profile:
          type: boolean
        parody_commentary_fan_label:
          type: string
          enum: ["None", "Parody", "Commentary", "Fan"]
        relationship_perspectives:
          $ref: "#/components/schemas/UserRelationshipPerspectives"
        avatar:
          $ref: "#/components/schemas/UserAvatar"
        core:
          $ref: "#/components/schemas/UserCore"
        dm_permissions:
          $ref: "#/components/schemas/UserDmPermissions"
        media_permissions:
          $ref: "#/components/schemas/UserMediaPermissions"
        privacy:
          $ref: "#/components/schemas/UserPrivacy"
        verification:
          $ref: "#/components/schemas/UserVerification"
        location:
          $ref: "#/components/schemas/UserLocation"
        profile_bio:
          $ref: "#/components/schemas/ProfileBio"
        grok_translated_bio_with_availability:
          $ref: "#/components/schemas/GrokTranslatedBioWithAvailability"
        profile_description_language:
          type: string
        super_follows_user_profile:
          $ref: "#/components/schemas/UserProfile"
        verified_user_profiles:
          $ref: "#/components/schemas/UserProfile"
        profile_sort_enabled:
          type: boolean
        action_counts:
          $ref: "#/components/schemas/UserActionCounts"
        banner:
          $ref: "#/components/schemas/UserBanner"
        follow_request_sent:
          type: boolean
        is_verified_organization:
          type: boolean
        notifications_settings:
          $ref: "#/components/schemas/UserNotificationsSettings"
        pinned_items:
          $ref: "#/components/schemas/UserPinnedItems"
        possibly_sensitive:
          type: boolean
        profile_metadata:
          $ref: "#/components/schemas/UserProfileMetadata"
        profile_translation:
          $ref: "#/components/schemas/UserProfileTranslation"
        relationship_counts:
          $ref: "#/components/schemas/UserRelationshipCounts"
        tweet_counts:
          $ref: "#/components/schemas/UserTweetCounts"
        website:
          $ref: "#/components/schemas/UserWebsite"

    UserActionCounts:
      required:
        - "favorites_count"
      properties:
        favorites_count:
          type: integer

    UserBanner:
      required:
        - "image_url"
      properties:
        image_url:
          type: string
          format: uri

    UserNotificationsSettings:
      required:
        - "notifications_enabled"
      properties:
        notifications_enabled:
          type: boolean

    UserPinnedItems:
      properties:
        tweet_ids_str:
          type: array
          items:
            type: string
            pattern: "^[0-9]+$"

    UserProfileMetadata:
      required:
        - "profile_interstitial_type"
      properties:
        profile_interstitial_type:
          type: string

    UserProfileTranslation:
      required:
        - "translator_type"
      properties:
        translator_type:
          type: string

    UserRelationshipCounts:
      required:
        - "followers"
        - "following"
      properties:
        followers:
          type: integer
        following:
          type: integer

    UserTweetCounts:
      required:
        - "tweets"
        - "media_tweets"
      properties:
        tweets:
          type: integer
        media_tweets:
          type: integer

    UserWebsite:
      required:
        - "url"
      properties:
        url:
          type: string

    UserCore:
      required:
        - "created_at"
        - "name"
        - "screen_name"
      properties:
        created_at:
          $ref: "./general.yaml#/components/schemas/TwitterTimeFormat"
        name:
          type: string
        screen_name:
          type: string

    UserProfessional:
      required:
        - "rest_id"
      properties:
        id:
          type: string
        rest_id:
          type: string
          pattern: "^[0-9]+$"
        professional_type:
          type: string
          enum: ["Business", "Creator"] # absent on some accounts (HomeTimeline, 2026-10-16)
        category:
          type: array
          items:
            $ref: "#/components/schemas/UserProfessionalCategory"

    UserProfessionalCategory:
      required:
        - "id"
        - "name"
        - "icon_name"
      properties:
        id:
          type: integer
        name:
          type: string # enum
        icon_name:
          type: string # IconBriefcaseStroke ?

    UserHighlightsInfo:
      required:
        - "can_highlight_tweets"
        - "highlighted_tweets"
      properties:
        can_highlight_tweets:
          type: boolean
        highlighted_tweets:
          type: string

    UserVerificationInfo:
      required:
        - "is_identity_verified"
      properties:
        is_identity_verified:
          type: boolean
        reason:
          $ref: "#/components/schemas/UserVerificationInfoReason"

    UserVerificationInfoReason:
      required:
        - "description"
        - "verified_since_msec"
      properties:
        description:
          $ref: "#/components/schemas/UserVerificationInfoReasonDescription"
        verified_since_msec:
          type: string
          pattern: "^-?[0-9]+$"
        override_verified_year:
          type: integer

    UserVerificationInfoReasonDescription:
      required:
        - "text"
        - "entities"
      properties:
        text:
          type: string
        entities:
          type: array
          items:
            $ref: "#/components/schemas/UserVerificationInfoReasonDescriptionEntities"

    UserVerificationInfoReasonDescriptionEntities:
      required:
        - "from_index"
        - "to_index"
        - "ref"
      properties:
        from_index:
          type: integer
        to_index:
          type: integer
        ref:
          $ref: "#/components/schemas/UserVerificationInfoReasonDescriptionEntitiesRef"

    UserVerificationInfoReasonDescriptionEntitiesRef:
      required:
        - "url"
        - "url_type"
      properties:
        url:
          type: string
          format: uri
        url_type:
          type: string
          enum: ["ExternalUrl"]

    UserTipJarSettings:
      properties:
        is_enabled:
          type: boolean
        patreon_handle:
          type: string
        bitcoin_handle:
          type: string
        ethereum_handle:
          type: string
        cash_app_handle:
          type: string
        venmo_handle:
          type: string
        gofundme_handle:
          type: string # uri
        bandcamp_handle:
          type: string # uri
        pay_pal_handle:
          type: string

    UserLegacyExtendedProfile:
      properties:
        birthdate:
          $ref: "#/components/schemas/UserLegacyExtendedProfileBirthdate"

    UserLegacyExtendedProfileBirthdate:
      required:
        - "day"
        - "month"
        - "visibility"
        - "year_visibility"
      properties:
        day:
          type: integer
        month:
          type: integer
        year:
          type: integer
        visibility:
          type: string
          enum: ["Self", "Public", "MutualFollow", "Followers", "Following"]
        year_visibility:
          type: string
          enum: ["Self", "Public", "MutualFollow", "Followers", "Following"]

    UserLegacy:
      required:
        - "default_profile"
        - "default_profile_image"
        - "description"
        - "entities"
        - "fast_followers_count"
        - "favourites_count"
        - "followers_count"
        - "friends_count"
        - "has_custom_timelines"
        - "is_translator"
        - "listed_count"
        - "media_count"
        - "normal_followers_count"
        - "possibly_sensitive"
        - "profile_interstitial_type"
        - "status"
        - "statuses_count"
        - "translator_type"
        - time_zone
        - "utc_offset"
        - withheld_description
        - withheld_scope
      properties:
        blocked_by:
          type: boolean
        blocking:
          type: boolean
        can_dm:
          type: boolean
        can_media_tag:
          type: boolean
        created_at:
          $ref: "./general.yaml#/components/schemas/TwitterTimeFormat"
        default_profile:
          type: boolean
        default_profile_image:
          type: boolean
        description:
          type: string
        entities:
          $ref: "#/components/schemas/ProfileBioEntities"
        fast_followers_count:
          type: integer
        favourites_count:
          type: integer
        follow_request_sent:
          type: boolean
        followed_by:
          type: boolean
        followers_count:
          type: integer
        following:
          type: boolean
        friends_count:
          type: integer
        has_custom_timelines:
          type: boolean
        is_translator:
          type: boolean
        listed_count:
          type: integer
        location:
          type: string
        media_count:
          type: integer
        muting:
          type: boolean
        name:
          type: string
        normal_followers_count:
          type: integer
        notifications:
          type: boolean
        pinned_tweet_ids_str:
          type: array
          items:
            type: string
        possibly_sensitive:
          type: boolean
        profile_banner_extensions:
          type: object
        profile_banner_url:
          type: string
          format: uri
        profile_image_extensions:
          type: object
        profile_image_url_https:
          type: string
          format: uri
        profile_interstitial_type:
          type: string
        protected:
          type: boolean
        screen_name:
          type: string
        statuses_count:
          type: integer
        translator_type:
          type: string
        url:
          type: string
        verified:
          type: boolean
        want_retweets:
          type: boolean
        verified_type:
          type: string
          enum: ["Business", "Government"]
        withheld_in_countries:
          type: array
          items:
            type: string # enum DE
        time_zone:
          type: string
        utc_offset:
          type: integer
        withheld_description:
          type: string
        withheld_scope:
          type: string

    UserUnavailable:
      required:
        - "__typename"
        - "reason"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # UserUnavailable
        reason:
          type: string
        message:
          type: string

    UserRelationshipPerspectives:
      properties:
        blocking:
          type: boolean
        blocked_by:
          type: boolean
        following:
          type: boolean
        followed_by:
          type: boolean
        live_following:
          type: boolean
        muting:
          type: boolean

    UserAvatar:
      required:
        - "image_url"
      properties:
        image_url:
          type: string
          format: uri

    UserDmPermissions:
      required:
        - "can_dm"
      properties:
        can_dm:
          type: boolean

    UserMediaPermissions:
      required:
        - "can_media_tag"
      properties:
        can_media_tag:
          type: boolean

    UserPrivacy:
      required:
        - "protected"
      properties:
        protected:
          type: boolean

    UserVerification:
      required:
        - "verified"
      properties:
        verified:
          type: boolean
        verified_type:
          type: string
          enum: ["Business", "Government"]

    UserLocation:
      required:
        - "location"
      properties:
        location:
          type: string

    ProfileBio:
      required:
        - "description"
      properties:
        description:
          type: string
        entities:
          $ref: "#/components/schemas/ProfileBioEntities"
        withheld_in_countries:
          type: array
          items:
            type: string

    GrokTranslatedBioWithAvailability:
      required:
        - "is_available"
      properties:
        is_available:
          type: boolean
        data:
          $ref: "#/components/schemas/GrokTranslatedBio"

    GrokTranslatedBio:
      required:
        - "destination_language"
        - "entities"
        - "source_language"
        - "translation"
      properties:
        destination_language:
          type: string
        entities:
          $ref: "#/components/schemas/Entities"
        source_language:
          type: string
        translation:
          type: string

    AffiliatesHighlightedLabel:
      properties:
        label:
          $ref: "#/components/schemas/UserLabel"

    IdentityProfileLabelsHighlightedLabel:
      properties:
        label:
          $ref: "#/components/schemas/UserLabel"

    UserLabel:
      required:
        - "badge"
        - "description"
        - "userLabelType"
      properties:
        badge:
          $ref: "#/components/schemas/UserLabelBadge"
        description:
          type: string
        longDescription:
          $ref: "#/components/schemas/UserLabelText"
        url:
          $ref: "#/components/schemas/UserLabelUrl"
        userLabelDisplayType:
          type: string
          enum: [Badge]
        userLabelType:
          type: string
          enum: [AutomatedLabel, BusinessLabel]

    UserLabelBadge:
      required:
        - "url"
      properties:
        url:
          type: string
          format: uri

    UserLabelUrl:
      required:
        - "url"
        - "urlType"
      properties:
        url:
          type: string
          format: uri
        urlType:
          type: string
          enum: [DeepLink]

    UserLabelText:
      required:
        - "entities"
        - "text"
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/UserLabelTextEntity"
        text:
          type: string

    UserLabelTextEntity:
      required:
        - "fromIndex"
        - "ref"
        - "toIndex"
      properties:
        fromIndex:
          type: integer
        ref:
          $ref: "#/components/schemas/UserLabelTextEntityRef"
        toIndex:
          type: integer

    UserLabelTextEntityRef:
      required:
        - "mention_results"
        - "screen_name"
        - "type"
      properties:
        mention_results:
          $ref: "#/components/schemas/UserLabelMentionResults"
        screen_name:
          type: string
        type:
          type: string
          enum: [TimelineRichTextMention]

    UserLabelMentionResults:
      required:
        - "result"
      properties:
        result:
          $ref: "#/components/schemas/UserLabelMentionUser"

    UserLabelMentionUser:
      required:
        - "__typename"
        - "core"
        - "rest_id"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # User
        core:
          $ref: "#/components/schemas/UserLabelMentionUserCore"
        rest_id:
          type: string
          pattern: "^[0-9]+$"

    UserLabelMentionUserCore:
      required:
        - "screen_name"
      properties:
        screen_name:
          type: string

    ProfileBioEntities:
      required:
        - "description"
      properties:
        description:
          $ref: "#/components/schemas/ProfileBioEntitiesUrls"
        url:
          $ref: "#/components/schemas/ProfileBioEntitiesUrls"

    ProfileBioEntitiesUrls:
      properties:
        urls:
          type: array
          items:
            $ref: "./tweet.yaml#/components/schemas/Url"

    UserProfile:
      required:
        - "super_follows_user_profile"
      properties:
        super_follows_user_profile:
          $ref: "#/components/schemas/SuperFollowUserProfile"

    SuperFollowUserProfile:
      required:
        - "is_active"
      properties:
        is_active:
          type: boolean
