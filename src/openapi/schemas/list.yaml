openapi: 3.0.3
info:
  title: Twitter OpenAPI
  version: 0.0.1
paths: {}
components:
  schemas:
    TwitterList:
      required:
        - "created_at"
        - "default_banner_media"
        - "default_banner_media_results"
        - "description"
        - "facepile_urls"
        - "following"
        - "id"
        - "id_str"
        - "is_member"
        - "member_count"
        - "mode"
        - "muting"
        - "name"
        - "pinning"
        - "subscriber_count"
        - "user_results"
      properties:
        created_at:
          type: integer
        custom_banner_media:
          $ref: "#/components/schemas/ListBannerMedia"
        custom_banner_media_results:
          $ref: "#/components/schemas/ListBannerMediaResults"
        default_banner_media:
          $ref: "#/components/schemas/ListBannerMedia"
        default_banner_media_results:
          $ref: "#/components/schemas/ListBannerMediaResults"
        description:
          type: string
        facepile_urls:
          type: array
          items:
            type: string
        followers_context:
          type: string
        following:
          type: boolean
        id:
          type: string
        id_str:
          type: string
          pattern: "^[0-9]+$"
        is_member:
          type: boolean
        member_count:
          type: integer
        members_context:
          type: string
        mode:
          type: string
          enum: [Public, Private]
        muting:
          type: boolean
        name:
          type: string
        pinning:
          type: boolean
        subscriber_count:
          type: integer
        user_results:
          $ref: "user.yaml#/components/schemas/UserResults"

    ListBannerMedia:
      required:
        - "media_info"
      properties:
        media_info:
          $ref: "#/components/schemas/ListBannerMediaInfo"

    ListBannerMediaResults:
      properties:
        result:
          $ref: "#/components/schemas/ApiMedia" # absent for lists without a banner

    ApiMedia:
      required:
        - "__typename"
        - "id"
        - "media_id"
        - "media_info"
        - "media_key"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # ApiMedia
        id:
          type: string
        media_id:
          type: string
          pattern: "^[0-9]+$"
        media_info:
          $ref: "#/components/schemas/ApiImage"
        media_key:
          type: string

    ApiImage:
      required:
        - "__typename"
        - "color_info"
        - "original_img_height"
        - "original_img_url"
        - "original_img_width"
        - "salient_rect"
      properties:
        __typename:
          $ref: "./typename.yaml#/components/schemas/TypeName" # ApiImage
        color_info:
          $ref: "./tweet.yaml#/components/schemas/ArticleCoverMediaColorInfo"
        original_img_height:
          type: integer
        original_img_url:
          type: string
          format: uri
        original_img_width:
          type: integer
        salient_rect:
          $ref: "#/components/schemas/ListBannerMediaSalientRect"

    ListBannerMediaInfo:
      required:
        - "original_img_height"
        - "original_img_url"
        - "original_img_width"
        - "salient_rect"
      properties:
        original_img_height:
          type: integer
        original_img_url:
          type: string
        original_img_width:
          type: integer
        salient_rect:
          $ref: "#/components/schemas/ListBannerMediaSalientRect"

    ListBannerMediaSalientRect:
      required:
        - "height"
        - "left"
        - "top"
        - "width"
      properties:
        height:
          type: integer
        left:
          type: integer
        top:
          type: integer
        width:
          type: integer
