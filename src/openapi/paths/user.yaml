openapi: 3.0.3
info:
  title: Twitter OpenAPI
  version: 0.0.1

paths:
  /graphql/{pathQueryId}/UserByScreenName:
    get:
      operationId: getUserByScreenName
      description: "get user by screen name"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
      tags:
        - "user"

  /graphql/{pathQueryId}/UserByRestId:
    get:
      operationId: getUserByRestId
      description: "get user by rest id"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
      tags:
        - "user"

  /graphql/{pathQueryId}/UsersByRestIds:
    get:
      operationId: getUsersByRestIds
      description: "get users by rest ids"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponse"
      tags:
        - "users"

  /graphql/{pathQueryId}/ViewerBadgeCounts:
    get:
      operationId: getViewerBadgeCounts
      description: get the unread badge counts of the viewer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewerBadgeCountsResponse"
      tags:
        - "user"
  /graphql/{pathQueryId}/UsersVerifiedAvatars:
    get:
      operationId: getUsersVerifiedAvatars
      description: verified-avatar users by ids
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersVerifiedAvatarsResponse"
      tags:
        - "users"

components:
  schemas:
    UserResponse:
      required:
        - "data"
      properties:
        data:
          $ref: "#/components/schemas/UserResponseData"
        errors:
          type: array
          items:
            $ref: "./../response/error.yaml#/components/schemas/ErrorResponse"

    UserResponseData:
      properties:
        user:
          $ref: "./../schemas/user.yaml#/components/schemas/UserResults"

    UsersResponse:
      required:
        - "data"
      properties:
        data:
          $ref: "#/components/schemas/UsersResponseData"
        errors:
          type: array
          items:
            $ref: "./../response/error.yaml#/components/schemas/ErrorResponse"

    UsersResponseData:
      properties:
        users:
          type: array
          items:
            $ref: "./../schemas/user.yaml#/components/schemas/UserResults"

    ViewerBadgeCountsResponse:
      required:
        - "data"
      properties:
        data:
          $ref: "#/components/schemas/ViewerBadgeCountsResponseData"
        errors:
          type: array
          items:
            $ref: "./../response/error.yaml#/components/schemas/ErrorResponse"

    ViewerBadgeCountsResponseData:
      required:
        - "viewer_v2"
      properties:
        viewer_v2:
          $ref: "#/components/schemas/ViewerBadgeCountsViewer"

    ViewerBadgeCountsViewer:
      required:
        - "user_results"
      properties:
        user_results:
          $ref: "#/components/schemas/ViewerBadgeCountsUserResults"

    ViewerBadgeCountsUserResults:
      required:
        - "result"
      properties:
        result:
          $ref: "#/components/schemas/ViewerBadgeCountsResult"

    ViewerBadgeCountsResult:
      required:
        - "__typename"
        - "badge_counts"
      properties:
        __typename:
          $ref: "./../schemas/typename.yaml#/components/schemas/TypeName" # User
        badge_counts:
          $ref: "#/components/schemas/BadgeCounts"

    BadgeCounts:
      required:
        - "dm_unread_count"
        - "is_from_urt"
        - "ntab_unread_count"
        - "total_unread_count"
        - "xchat_unread_count"
      properties:
        dm_unread_count:
          type: integer
        is_from_urt:
          type: boolean
        ntab_unread_count:
          type: integer
        total_unread_count:
          type: integer
        xchat_unread_count:
          type: integer

    UsersVerifiedAvatarsResponse:
      required:
        - "data"
      properties:
        data:
          $ref: "#/components/schemas/UsersVerifiedAvatarsResponseData"
        errors:
          type: array
          items:
            $ref: "./../response/error.yaml#/components/schemas/ErrorResponse"

    UsersVerifiedAvatarsResponseData:
      required:
        - "usersResults"
      properties:
        usersResults:
          type: array
          items:
            $ref: "#/components/schemas/VerifiedAvatarUserResults"

    VerifiedAvatarUserResults:
      required:
        - "result"
      properties:
        result:
          $ref: "#/components/schemas/VerifiedAvatarUser"

    VerifiedAvatarUser: # partial user
      required:
        - "__typename"
        - "affiliates_highlighted_label"
        - "is_blue_verified"
        - "profile_image_shape"
        - "rest_id"
        - "verification"
      properties:
        __typename:
          $ref: "./../schemas/typename.yaml#/components/schemas/TypeName" # User
        affiliates_highlighted_label:
          $ref: "./../schemas/user.yaml#/components/schemas/AffiliatesHighlightedLabel"
        is_blue_verified:
          type: boolean
        profile_image_shape:
          type: string
        rest_id:
          type: string
          pattern: "^[0-9]+$"
        verification:
          type: object
          properties: {} # always {}
