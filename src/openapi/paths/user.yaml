openapi: 3.0.3
info:
  title: Twitter OpenAPI
  version: 0.0.1

paths:
  /graphql/{pathQueryId}/UserByScreenName:
    get:
      operationId: getUserByScreenName
      description: "get user by screen name"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
      tags:
        - "user"

  /graphql/{pathQueryId}/UserByRestId:
    get:
      operationId: getUserByRestId
      description: "get user by rest id. Deprecated: X answers 403 outside a browser since 2026-10"
      deprecated: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
      tags:
        - "user"

  /graphql/{pathQueryId}/UsersByRestIds:
    get:
      operationId: getUsersByRestIds
      description: "get users by rest ids. Deprecated: X answers 403 outside a browser since 2026-10"
      deprecated: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponse"
      tags:
        - "users"

  /graphql/{pathQueryId}/ViewerBadgeCounts:
    get:
      operationId: getViewerBadgeCounts
      description: get the unread badge counts of the viewer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewerBadgeCountsResponse"
      tags:
        - "user"
  /graphql/{pathQueryId}/UsersVerifiedAvatars:
    get:
      operationId: getUsersVerifiedAvatars
      description: verified-avatar users by ids
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersVerifiedAvatarsResponse"
      tags:
        - "users"

  /graphql/{pathQueryId}/AboutAccountQuery:
    get:
      operationId: getAboutAccountQuery
      description: "About this account: join date, where the account is based, username changes, verification"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutAccountResponse"
      tags:
        - "user"

  /graphql/{pathQueryId}/SidebarUserRecommendations:
    get:
      operationId: getSidebarUserRecommendations
      description: "who to follow, shown in the sidebar of a profile"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SidebarUserRecommendationsResponse"
      tags:
        - "users"

components:
  schemas:
    UserResponse:
      required:
        - "data"
      properties:
        data:
          $ref: "#/components/schemas/UserResponseData"
        errors:
          type: array
          items:
            $ref: "./../response/error.yaml#/components/schemas/ErrorResponse"

    UserResponseData:
      properties:
        user:
          $ref: "./../schemas/user.yaml#/components/schemas/UserResults"

    UsersResponse:
      required:
        - "data"
      properties:
        data:
          $ref: "#/components/schemas/UsersResponseData"
        errors:
          type: array
          items:
            $ref: "./../response/error.yaml#/components/schemas/ErrorResponse"

    UsersResponseData:
      properties:
        users:
          type: array
          items:
            $ref: "./../schemas/user.yaml#/components/schemas/UserResults"

    ViewerBadgeCountsResponse:
      required:
        - "data"
      properties:
        data:
          $ref: "#/components/schemas/ViewerBadgeCountsResponseData"
        errors:
          type: array
          items:
            $ref: "./../response/error.yaml#/components/schemas/ErrorResponse"

    ViewerBadgeCountsResponseData:
      required:
        - "viewer_v2"
      properties:
        viewer_v2:
          $ref: "#/components/schemas/ViewerBadgeCountsViewer"

    ViewerBadgeCountsViewer:
      required:
        - "user_results"
      properties:
        user_results:
          $ref: "#/components/schemas/ViewerBadgeCountsUserResults"

    ViewerBadgeCountsUserResults:
      required:
        - "result"
      properties:
        result:
          $ref: "#/components/schemas/ViewerBadgeCountsResult"

    ViewerBadgeCountsResult:
      required:
        - "__typename"
        - "badge_counts"
      properties:
        __typename:
          $ref: "./../schemas/typename.yaml#/components/schemas/TypeName" # User
        badge_counts:
          $ref: "#/components/schemas/BadgeCounts"

    BadgeCounts:
      required:
        - "dm_unread_count"
        - "is_from_urt"
        - "ntab_unread_count"
        - "total_unread_count"
        - "xchat_unread_count"
      properties:
        dm_unread_count:
          type: integer
        is_from_urt:
          type: boolean
        ntab_unread_count:
          type: integer
        total_unread_count:
          type: integer
        xchat_unread_count:
          type: integer

    UsersVerifiedAvatarsResponse:
      required:
        - "data"
      properties:
        data:
          $ref: "#/components/schemas/UsersVerifiedAvatarsResponseData"
        errors:
          type: array
          items:
            $ref: "./../response/error.yaml#/components/schemas/ErrorResponse"

    UsersVerifiedAvatarsResponseData:
      required:
        - "usersResults"
      properties:
        usersResults:
          type: array
          items:
            $ref: "#/components/schemas/VerifiedAvatarUserResults"

    VerifiedAvatarUserResults:
      required:
        - "result"
      properties:
        result:
          $ref: "#/components/schemas/VerifiedAvatarUser"

    VerifiedAvatarUser: # partial user
      required:
        - "__typename"
        - "affiliates_highlighted_label"
        - "is_blue_verified"
        - "profile_image_shape"
        - "rest_id"
        - "verification"
      properties:
        __typename:
          $ref: "./../schemas/typename.yaml#/components/schemas/TypeName" # User
        affiliates_highlighted_label:
          $ref: "./../schemas/user.yaml#/components/schemas/AffiliatesHighlightedLabel"
        is_blue_verified:
          type: boolean
        profile_image_shape:
          type: string
        rest_id:
          type: string
          pattern: "^[0-9]+$"
        verification:
          type: object
          properties: {} # always {}

    AboutAccountResponse:
      required:
        - "data"
      properties:
        data:
          $ref: "#/components/schemas/AboutAccountData"
        errors:
          type: array
          items:
            $ref: "./../response/error.yaml#/components/schemas/ErrorResponse"


    AboutAccountData:
      required:
        - "user_result_by_screen_name"
      properties:
        user_result_by_screen_name:
          $ref: "#/components/schemas/AboutAccountUserResult"

    AboutAccountUserResult:
      required:
        - "id"
        - "result"
      properties:
        id:
          type: string
        result:
          $ref: "#/components/schemas/AboutAccountUser"

    AboutAccountUser: # the "About this account" panel: a reduced User plus about_profile
      required:
        - "__typename"
        - "rest_id"
        - "id"
        - "about_profile"
        - "affiliates_highlighted_label"
        - "avatar"
        - "core"
        - "identity_profile_labels_highlighted_label"
        - "is_blue_verified"
        - "privacy"
        - "profile_image_shape"
        - "verification"
        - "verification_info"
      properties:
        __typename:
          $ref: "./../schemas/typename.yaml#/components/schemas/TypeName" # User
        rest_id:
          type: string
          pattern: "^[0-9]+$"
        id:
          type: string
        about_profile:
          $ref: "#/components/schemas/AboutProfile"
        affiliates_highlighted_label:
          $ref: "./../schemas/user.yaml#/components/schemas/AffiliatesHighlightedLabel"
        avatar:
          $ref: "./../schemas/user.yaml#/components/schemas/UserAvatar"
        core:
          $ref: "./../schemas/user.yaml#/components/schemas/UserCore"
        identity_profile_labels_highlighted_label:
          $ref: "./../schemas/user.yaml#/components/schemas/IdentityProfileLabelsHighlightedLabel"
        is_blue_verified:
          type: boolean
        privacy:
          $ref: "./../schemas/user.yaml#/components/schemas/UserPrivacy"
        profile_image_shape:
          type: string
          enum: [Circle, Square, Hexagon]
        verification:
          $ref: "./../schemas/user.yaml#/components/schemas/UserVerification"
        verification_info:
          $ref: "#/components/schemas/AboutAccountVerificationInfo"

    AboutProfile:
      required:
        - "account_based_in"
        - "affiliate_username"
        - "learn_more_url"
        - "location_accurate"
        - "source"
        - "username_changes"
      properties:
        account_based_in:
          type: string
        affiliate_username:
          type: string
        learn_more_url:
          type: string
          format: uri
        location_accurate:
          type: boolean
        source:
          type: string
        username_changes:
          $ref: "#/components/schemas/AboutProfileUsernameChanges"

    AboutProfileUsernameChanges:
      required:
        - "count"
      properties:
        count:
          type: string
          pattern: "^[0-9]+$"
        last_changed_at_msec:
          type: string
          pattern: "^[0-9]+$"

    AboutAccountVerificationInfo:
      required:
        - "id"
        - "reason"
      properties:
        id:
          type: string
        reason:
          $ref: "#/components/schemas/AboutAccountVerificationInfoReason"

    AboutAccountVerificationInfoReason:
      required:
        - "verified_since_msec"
      properties:
        verified_since_msec:
          type: string
          pattern: "^-?[0-9]+$"
        override_verified_year:
          type: integer

    SidebarUserRecommendationsResponse:
      required:
        - "data"
      properties:
        data:
          $ref: "#/components/schemas/SidebarUserRecommendationsData"
        errors:
          type: array
          items:
            $ref: "./../response/error.yaml#/components/schemas/ErrorResponse"


    SidebarUserRecommendationsData:
      required:
        - "sidebar_user_recommendations"
      properties:
        sidebar_user_recommendations:
          type: array
          items:
            $ref: "#/components/schemas/SidebarUserRecommendation"

    SidebarUserRecommendation:
      required:
        - "token"
        - "user_results"
      properties:
        token:
          type: string
        user_results:
          $ref: "./../schemas/user.yaml#/components/schemas/UserResults"
