        color_info:
          $ref: '#/components/schemas/MediaColorInfo'
        original_img_height:
          type: integer
        original_img_url:
          format: uri
          type: string
        original_img_width:
          type: integer
        salient_rect:
          $ref: '#/components/schemas/MediaSalientRect'
