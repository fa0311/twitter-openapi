components:
  schemas:
    AboutAccountData:
      properties:
        user_result_by_screen_name:
          $ref: '#/components/schemas/AboutAccountUserResult'
      required:
      - user_result_by_screen_name
    AboutAccountResponse:
      properties:
        data:
          $ref: '#/components/schemas/AboutAccountData'
        errors:
          items:
            $ref: '#/components/schemas/ErrorResponse'
          type: array
      required:
      - data
    AboutAccountUser:
      properties:
        __typename:
          $ref: '#/components/schemas/TypeName'
        about_profile:
          $ref: '#/components/schemas/AboutProfile'
        affiliates_highlighted_label:
          $ref: '#/components/schemas/AffiliatesHighlightedLabel'
        avatar:
          $ref: '#/components/schemas/UserAvatar'
        core:
          $ref: '#/components/schemas/UserCore'
        id:
          type: string
        identity_profile_labels_highlighted_label:
          $ref: '#/components/schemas/IdentityProfileLabelsHighlightedLabel'
        is_blue_verified:
          type: boolean
        privacy:
          $ref: '#/components/schemas/UserPrivacy'
        profile_image_shape:
          enum:
          - Circle
          - Square
          - Hexagon
          type: string
        rest_id:
          pattern: ^[0-9]+$
          type: string
        verification:
          $ref: '#/components/schemas/UserVerification'
        verification_info:
          $ref: '#/components/schemas/AboutAccountVerificationInfo'
      required:
      - __typename
      - rest_id
      - id
      - about_profile
      - affiliates_highlighted_label
      - avatar
      - core
      - identity_profile_labels_highlighted_label
      - is_blue_verified
      - privacy
      - profile_image_shape
      - verification
      - verification_info
    AboutAccountUserResult:
      properties:
        id:
          type: string
        result:
          $ref: '#/components/schemas/AboutAccountUser'
      required:
      - id
      - result
    AboutAccountVerificationInfo:
      properties:
        id:
          type: string
        reason:
          $ref: '#/components/schemas/AboutAccountVerificationInfoReason'
      required:
      - id
      - reason
    AboutAccountVerificationInfoReason:
      properties:
        override_verified_year:
          type: integer
        verified_since_msec:
          pattern: ^-?[0-9]+$
          type: string
      required:
      - verified_since_msec
    AboutCommunityResult:
      properties:
        __typename:
          $ref: '#/components/schemas/TypeName'
        about_timeline:
          $ref: '#/components/schemas/TimelineResult'
      required:
      - __typename
      - about_timeline
    AboutCommunityResults:
      properties:
        result:
          $ref: '#/components/schemas/AboutCommunityResult'
      required:
      - result
    AboutCommunityTweetData:
      properties:
        communityResults:
          $ref: '#/components/schemas/AboutCommunityResults'
      required:
      - communityResults
    AboutProfile:
      properties:
        account_based_in:
          type: string
        affiliate_username:
          type: string
        learn_more_url:
          format: uri
          type: string
        location_accurate:
          type: boolean
        source:
          type: string
        username_changes:
          $ref: '#/components/schemas/AboutProfileUsernameChanges'
      required:
      - account_based_in
      - affiliate_username
      - learn_more_url
      - location_accurate
      - source
      - username_changes
    AboutProfileUsernameChanges:
      properties:
        count:
          pattern: ^[0-9]+$
          type: string
        last_changed_at_msec:
          pattern: ^[0-9]+$
          type: string
      required:
      - count
