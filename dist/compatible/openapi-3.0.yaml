        post_count:
          pattern: ^[0-9]+$
          type: string
        rest_id:
          pattern: ^[0-9]+$
          type: string
        social_proof:
          items:
            $ref: '#/components/schemas/AiTrendSocialProof'
          type: array
      required:
      - __typename
      - id
      - rest_id
      - core
      - post_count
      - social_proof
