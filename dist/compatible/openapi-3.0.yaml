        renderSalesCtaWebsiteCard:
          type: boolean
        showOverlayOnFirstCard:
          type: boolean
        unifiedCardOverride:
          type: string
      required:
      - isQuickPromote
      - renderLegacyWebsiteCard
      - renderSalesCtaWebsiteCard
